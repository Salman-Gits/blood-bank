server.port=${PORT:8080}

# MySQL Database Configuration (Supports Koyeb / Cloud DB environment variables with sensible defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/bloodbank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:rootpassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional fallback: If MySQL is not running, run with profile: -Dspring.profiles.active=dev
# to use in-memory H2 database for zero-config testing.

# CORS Configuration - supports Koyeb custom domains and frontend URLs via CORS_ALLOWED_ORIGINS
bloodbank.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://*.koyeb.app,https://*.vercel.app,https://*.netlify.app}

# App Info
spring.application.name=Blood Bank & Donor Management System
