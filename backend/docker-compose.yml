version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: bloodbank-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bloodbank_db
      MYSQL_USER: bloodbank
      MYSQL_PASSWORD: bloodbank123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql

volumes:
  mysql_data:
